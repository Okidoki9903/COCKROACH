[package]
name = "cockroach_proto"
version = "0.1.0"
edition = "2024"
description = "Prototype COCKROACH : caméra à hauteur d'insecte + marche multi-surfaces (specs docs/specs/)"
publish = false

[dependencies]
bevy = "0.19.1"
avian3d = "0.7.0"

# Compilation rapide en dev, mais dépendances optimisées (Bevy est lent en debug pur).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
